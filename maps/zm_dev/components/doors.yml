3_to_4:
  connects: ["3_COM_2CUB", "4_CUB"]
  unlocks_doors: [ "3_to_4_bis" ]
  type: "DOOR"
  cost: 250
  trigger:
    type: "ZONE"
    region:
      type: "CUBOID"
      min: { x: -30, y: -60, z: -2 }
      max: { x: -34, y: -57, z: 2 }
  animation:
    type: "INSTANT"
    region:
      type: "CUBOID"
      min: { x: -32, y: -58, z: 1 }
      max: { x: -32, y: -58, z: -2 }

3_to_4_bis:
  connects: [ "3_COM_2CUB", "4_CUB" ]
  unlocks_doors: [ "3_to_4" ]
  type: "DOOR"
  cost: 250
  trigger:
    type: "LOOK"
    region:
      type: "CUBOID"
      min: { x: -35, y: -57, z: 15 }
      max: { x: -38, y: -60, z: 15 }
  animation:
    duration: 1000
    type: "TRANSFORM"
    region:
      type: "CUBOID"
      min: { x: -35, y: -57, z: 15 }
      max: { x: -38, y: -60, z: 15 }
    pivot: { x: -38.5, y: -59, z: 15 }
    scale: { x: 0, y: 1, z: 1 }
    scale_anchor: "PIVOT"
    completion_mode: "RM"

4_to_5:
  connects: [ "4_CUB", "5_CUB" ]
  type: "DEBRIS"
  cost: 1000
  trigger:
    type: "LOOK"
    max_distance: 3.0
    region:
      type: "CUBOID"
      min: { x: -36, y: -58, z: -9 }
      max: { x: -42, y: -60, z: -9 }
  animation:
    duration: 1000
    type: "MULTI_TRANSFORM"
    parts:
      # left door
      - region:
          type: "CUBOID"
          min: { x: -42, y: -58, z: -9 }
          max: { x: -40, y: -60, z: -9 }
        pivot: { x: -42, y: -59, z: -9 }
        rotation: { x: 0, y: 90, z: 0 }
        completion_mode: "BLOCKS"

      # right door
      - region:
          type: "CUBOID"
          min: { x: -36, y: -58, z: -9 }
          max: { x: -39, y: -60, z: -9 }
        pivot: { x: -36, y: -59, z: -9 }
        rotation: { x: 0, y: -90, z: 0 }
        delay: 750
        completion_mode: "DISPLAY"

