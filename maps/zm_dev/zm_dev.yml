        - {
          type: "CUBOID",
          min: { x: -17, y: -60, z: 23 },
          max: { x: -20, y: -57, z: -2 }
        }
        - {
          type: "CUBOID",
          min: { x: -20, y: -60, z: -2 },
          max: { x: -32, y: -57, z: 1 }
        }
        - {
          type: "CUBOID",
          min: { x: -17, y: -60, z: 23 },
          max: { x: -28, y: -56, z: 10 }
        }
        - {
          type: "CUBOID",
          min: { x: -38, y: -60, z: 22 },
          max: { x: -26, y: -56, z: 16 }
        }

  4_CUB:
    unlocked: false
    region:
